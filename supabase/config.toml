# Minimal Supabase config for local/CLI deploy of Edge Functions.
# Project link: supabase link --project-ref <ref>

[auth]
site_url = "https://rogie.github.io/figma-webgpu-shader-studio/"
additional_redirect_urls = [
  "http://localhost:5173/**",
  "https://rogie.github.io/figma-webgpu-shader-studio/**",
]

[auth.email]
enable_confirmations = true
max_frequency = "1m"
otp_length = 8

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[storage.vector]
enabled = false

[functions.chat]
# BYOK chat forwards the caller's key; JWT is optional.
verify_jwt = false
